<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fafaf8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Échos">
<title>Échos · Console</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* =====================================================================
   Échos · Console : l'admin, dans le style « Maison » du site.
   Fond blanc cassé, encre, bleu Sèvres, Familjen Grotesk + Instrument Serif.
   Téléphone d'abord : barre d'onglets + bouton central, fiches en tiroir.
   ===================================================================== */
:root{
  --bg:#fafaf8; --bg2:#ffffff; --soft:#f1efea; --soft2:#e9e6df; --panel:#ffffff; --panel2:#f1efea; --solid:#ffffff;
  --ink:#121212; --ink2:#2b2b2a; --dim:#6d6d6a; --dim2:#a3a29d; --line:rgba(18,18,18,.1); --line2:rgba(18,18,18,.18);
  --acc:#1f3d9c; --acc-soft:#e8ecf8; --blue:#1f3d9c; --violet:#5b3fa6; --gold:#b8913a; --green:#1f7a4d; --amber:#a8670f; --red:#b3361f; --cyan:#1f7a9c;
  --sans:"Familjen Grotesk",system-ui,sans-serif; --serif:"Instrument Serif",Georgia,serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --r:18px; --tab:66px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,h4,p{margin:0}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
::selection{background:var(--acc-soft)}
[hidden]{display:none!important}
em{font-family:var(--serif);font-weight:400;font-style:italic;letter-spacing:-.02em}
.mono{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.dim{color:var(--dim)}
.num{font-variant-numeric:tabular-nums}
.grad{color:var(--acc)}
.sp{flex:1}
.wrap{max-width:1380px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* ---------------- en-tête ---------------- */
.app{min-height:100dvh}
.top{position:sticky;top:0;z-index:30;padding-top:var(--sat);background:rgba(250,250,248,.86);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border-bottom:1px solid var(--line)}
.top .hdin{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.brand svg{transition:transform .8s var(--ease)}
.brand:hover svg{transform:rotate(180deg)}
.brand small{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-left:2px;padding:4px 7px;border-radius:999px;background:var(--acc-soft)}
.nav{display:none}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.live{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);font-size:13px;color:var(--dim);white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:ping 2s infinite;flex:none;display:inline-block}
.dot.amber{background:#d08a1f;animation-name:pinga}.dot.red{background:var(--red);animation:none}.dot.off{background:var(--dim2);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(31,122,77,.5)}70%,100%{box-shadow:0 0 0 8px rgba(31,122,77,0)}}
@keyframes pinga{0%{box-shadow:0 0 0 0 rgba(208,138,31,.5)}70%,100%{box-shadow:0 0 0 8px rgba(208,138,31,0)}}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--ink);flex:none;transition:background .3s,color .3s}
.ib:hover{background:var(--ink);color:var(--bg)}
.srch{display:none;align-items:center;gap:10px;height:40px;border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:0 8px 0 14px;color:var(--dim);font-size:14px;transition:border-color .25s,box-shadow .25s}
.srch:hover{border-color:var(--ink);box-shadow:0 4px 18px -8px rgba(0,0,0,.2)}
.kbd,.srch kbd{font:500 10px var(--mono);border:1px solid var(--line);border-radius:6px;padding:3px 6px;color:var(--dim)}
main{padding-top:30px;padding-bottom:calc(var(--tab) + var(--sab) + 50px)}
@media (max-width:560px){.top .live span{display:none}.top .live{padding:0 15px}.brand small{display:none}}

/* barre d'onglets (téléphone) */
.tabs{position:fixed;left:10px;right:10px;bottom:calc(var(--sab) + 10px);z-index:40;height:var(--tab);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.9);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 20px 40px -22px rgba(0,0,0,.35)}
.tabs a,.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--dim);position:relative;height:100%;justify-content:center}
.tabs a svg{width:21px;height:21px}
.tabs a.on{color:var(--ink);font-weight:600}
.tabs a b{position:absolute;top:8px;left:calc(50% + 5px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--acc);color:#fff;font:600 10px var(--sans);display:grid;place-items:center}
.fab{width:50px!important;height:50px!important;margin:auto;border-radius:50%;background:var(--ink)!important;color:var(--bg)!important;display:grid!important;place-items:center;transition:transform .3s var(--ease),background .3s}
.fab:hover{transform:rotate(90deg);background:var(--acc)!important}
.fab svg{width:22px;height:22px}

@media (min-width:1180px){
  .nav{display:flex;gap:2px;margin:0 auto}
  .nav a{position:relative;font-size:14.5px;padding:9px 14px;border-radius:999px;transition:background .25s,color .25s;white-space:nowrap}
  .nav a:hover{background:var(--soft)}
  .nav a.on{background:var(--ink);color:var(--bg)}
  .nav a sup{font:500 9px var(--mono);color:var(--acc);margin-left:3px}
  .nav a.on sup{color:#c9d4ff}
  .tools{margin-left:0}
  .srch{display:flex}
  .top .hdin{height:76px}
  .tools .mob{display:none}
  .tabs{display:none}
  main{padding-top:40px;padding-bottom:80px}
}

/* ---------------- titres ---------------- */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 30px;padding-bottom:26px;margin-bottom:26px;border-bottom:1px solid var(--line)}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:13px;color:var(--dim);background:var(--soft);border-radius:999px;padding:6px 13px 6px 10px;max-width:100%;margin-bottom:18px}
.eyebrow svg{color:var(--acc)}
.h1{font-weight:500;font-size:clamp(44px,5.6vw,84px);line-height:.94;letter-spacing:-.045em}
.sub{color:var(--dim);font-size:clamp(15.5px,1.2vw,17.5px);line-height:1.55;margin-top:16px;max-width:56ch}
.h2{font-size:19px;font-weight:600;letter-spacing:-.025em;display:flex;align-items:center;gap:8px}
.h2 svg{color:var(--acc)}
.sec{margin-top:28px}
.sech{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.link{font-size:13.5px;color:var(--acc);font-weight:500}

/* ---------------- cartes ---------------- */
.card{position:relative;border:1px solid var(--line);background:var(--bg2);border-radius:var(--r);overflow:hidden}
.pad{padding:20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.bento{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.bento>.card:not(.kpi){grid-column:1/-1}
@media (min-width:980px){.bento{grid-template-columns:repeat(4,minmax(0,1fr))}.bento>.card:not(.kpi){grid-column:auto}.span2{grid-column:span 2!important}.span4{grid-column:1/-1}.row2{grid-row:span 2}}
.span-all{grid-column:1/-1}

/* KPI */
.kpi{padding:18px;display:flex;flex-direction:column;gap:4px;min-height:150px;background:var(--soft);border:0;transition:background .4s var(--ease),color .4s}
.kpi .k{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--dim)}
.kpi .v{font-size:clamp(28px,4vw,40px);font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.05;margin-top:6px}
.kpi .d{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:6px}
.up{color:var(--green)}.down{color:var(--red)}
.spark{margin-top:auto;height:34px;width:100%}
.kpi.hero-k{background:var(--ink);color:var(--bg)}
.kpi.hero-k .k,.kpi.hero-k .d{color:rgba(250,250,248,.6)}
.kpi.hero-k .up{color:#8fe0b5}
a.kpi:hover{background:var(--soft2)}
a.kpi.hero-k:hover{background:var(--acc)}

/* graphique */
.chart{width:100%;height:200px;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--dim)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* entonnoir */
.funnel{display:grid;gap:8px}
.fstep{display:grid;grid-template-columns:90px 1fr 40px;align-items:center;gap:10px;font-size:13.5px}
.fbar{height:24px;border-radius:999px;background:var(--soft);overflow:hidden;position:relative}
.fbar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--ink);transform-origin:left;animation:grow 1.1s var(--ease) both}
.fstep:last-child .fbar i{background:var(--acc)}
@keyframes grow{from{transform:scaleX(0)}}

/* listes */
.item{display:flex;gap:14px;align-items:center;padding:13px 20px;border-top:1px solid var(--line);transition:background .2s;cursor:pointer;width:100%;text-align:left}
.item:first-child{border-top:0}
.item:hover{background:var(--soft)}
.th{width:50px;height:58px;border-radius:10px;object-fit:cover;background:var(--soft);flex:none}
.th.lg{width:64px;height:76px}
.ph0{display:grid;place-items:center;color:var(--dim2)}
.body{flex:1;min-width:0}
.body b{display:block;font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body .m{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--dim);margin-top:3px;align-items:center}
.end{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.end b{display:block;font-weight:600;font-size:15.5px}
.end small{color:var(--dim);font-size:12px}
.chev{color:var(--dim2);font-size:18px}

/* pastilles */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font:500 12px var(--sans);background:var(--soft);color:var(--ink2);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.no-dot::before{display:none}
.pill.green{color:var(--green);background:#e3f1e9}
.pill.amber{color:var(--amber);background:#f7ecd8}
.pill.red{color:var(--red);background:#f8e4df}
.pill.blue{color:var(--acc);background:var(--acc-soft)}
.pill.violet{color:var(--violet);background:#ece7f6}
.pill.gold{color:#8c6a22;background:#f3ecdc}
.pill.live::before{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}

/* boutons (comme le site : pilule encre, remplissage bleu au survol) */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;height:46px;padding:0 22px;border-radius:999px;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;isolation:isolate;background:var(--ink);color:var(--bg);transition:transform .3s var(--ease),color .3s,box-shadow .3s}
.btn::before{content:"";position:absolute;inset:0;background:var(--acc);border-radius:inherit;transform:scale(0);transition:transform .55s var(--ease);z-index:-1}
.btn:hover::before{transform:scale(2.2)}
.btn:active{transform:scale(.97)}
.btn.sec{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2);margin-top:0}
.btn.sec::before{background:var(--ink)}
.btn.sec:hover{color:var(--bg)}
.btn.ghost{background:transparent;color:var(--dim)}
.btn.ghost::before{background:var(--soft)}
.btn.ghost:hover{color:var(--ink)}
.btn.ok{background:var(--green);color:#fff}
.btn.sm{height:36px;padding:0 15px;font-size:13.5px}
.btn.full{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--soft);gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{height:34px;padding:0 15px;border-radius:999px;font-size:14px;color:var(--ink2);white-space:nowrap;flex:none;transition:background .3s,color .3s}
.seg button sup{font:500 9px var(--mono);margin-left:3px;color:var(--dim)}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg button.on sup{color:rgba(250,250,248,.6)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}

/* champs */
.f{display:grid;gap:6px;font-size:13px;color:var(--dim)}
.in{width:100%;height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);padding:0 14px;font-size:15px;color:var(--ink);transition:border-color .2s,box-shadow .2s}
textarea.in{height:auto;min-height:120px;padding:12px 14px;line-height:1.5;resize:vertical}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 19px) 20px,calc(100% - 14px) 20px;background-size:5px 5px;background-repeat:no-repeat}
.in:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 4px rgba(18,18,18,.06)}
.inrow{display:flex;gap:8px;align-items:flex-end}.inrow>*{flex:1;min-width:0}
.eur{position:relative}.eur::after{content:"€";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}.eur .in{padding-right:30px}
.searchf{display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);color:var(--dim);flex:1;min-width:200px;transition:border-color .25s}
.searchf:focus-within{border-color:var(--ink)}
.searchf input{border:0;background:none;outline:0;flex:1;min-width:0;font-size:14.5px;color:var(--ink)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-top:1px solid var(--line)}
.tog:first-child{border-top:0}
.tog .t b{display:block;font-weight:600;font-size:15px}.tog .t small{display:block;color:var(--dim);font-size:13px;margin-top:2px}
.sw{appearance:none;width:44px;height:26px;border-radius:999px;background:var(--soft2);position:relative;flex:none;cursor:pointer;transition:background .3s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .35s var(--ease)}
.sw:checked{background:var(--ink)}.sw:checked::after{transform:translateX(18px)}

/* lots : comme les cartes produit du site */
.lot{display:flex;flex-direction:column;cursor:pointer;border:0;background:none;border-radius:0;overflow:visible}
.lot .img{position:relative;aspect-ratio:4/3;background:var(--soft2);overflow:hidden;border-radius:14px}
.lot .img img{width:100%;height:100%;object-fit:cover;transition:transform 1.3s var(--ease);filter:saturate(1.05) contrast(1.03)}
.lot:hover .img img{transform:scale(1.05)}
.lot .img .tl{position:absolute;left:10px;top:10px;display:flex;gap:6px}
.lot .img .pill{background:rgba(255,255,255,.92)}
.lot .img .cd{position:absolute;right:10px;top:10px;font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:999px;background:var(--ink);color:var(--bg)}
.lot .c{padding:12px 2px 0;display:grid;gap:4px}
.lot .c b{font-weight:600;font-size:15.5px;line-height:1.3;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lot .c .m{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:13px;color:var(--dim)}
.target{display:flex;align-items:center;gap:10px;margin:10px 0 0;padding:10px 10px 10px 14px;border-radius:12px;background:var(--soft)}
.target .t{flex:1;min-width:0;font-size:12.5px;color:var(--dim)}
.target .t b{display:block;font-size:20px;letter-spacing:-.03em;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.target input{width:104px;height:38px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);text-align:right;padding:0 14px;color:var(--ink);font-size:14px}
.target input:focus{outline:0;border-color:var(--ink)}
.lot .acts{padding:10px 0 0}

/* stock en colonnes */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(264px,1fr);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;margin:0 -20px;padding:0 20px 8px;scrollbar-width:thin}
@media (min-width:980px){.kanban{margin:0;padding:0 0 8px}}
.col{scroll-snap-align:start;display:flex;flex-direction:column;gap:10px;min-width:0;background:var(--soft);border-radius:var(--r);padding:10px}
.colh{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:4px 4px 2px}
.colh .n{font:500 11px var(--mono);color:var(--dim);margin-left:auto}
.col .pill{background:var(--bg2)}
.kcard{padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;cursor:pointer;border-color:transparent;transition:transform .35s var(--ease),box-shadow .35s}
.kcard:hover{transform:translateY(-2px);box-shadow:0 16px 30px -22px rgba(0,0,0,.4)}
.kcard .top2{display:flex;gap:12px;align-items:center}
.chs{display:flex;gap:5px;flex-wrap:wrap}
.ch{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;background:var(--soft);color:var(--dim)}
.ch i{width:6px;height:6px;border-radius:50%;background:var(--dim2)}
.ch.ok{color:var(--ink)}.ch.ok i{background:var(--green)}.ch.wait i{background:#d08a1f}.ch.err i{background:var(--red)}
.pchips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pchip{padding:9px 4px;border-radius:12px;background:var(--soft);text-align:center;transition:background .3s,color .3s,transform .15s}
.pchip:hover{background:var(--soft2)}.pchip:active{transform:scale(.96)}
.pchip b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pchip span{font-size:11px;color:var(--dim)}
.pchip.rule{background:var(--ink);color:var(--bg)}.pchip.rule span{color:#c9d4ff}
.pchip.rule:hover{background:var(--acc)}

/* connexions */
.net{position:relative;height:380px;background:var(--soft);border:0}
@media (min-width:700px){.net{height:440px}}
.net>svg{position:absolute;inset:0;width:100%;height:100%}
.net .wire{fill:none;stroke:var(--line2);stroke-width:1.2}
.net .flow{fill:none;stroke-width:2;stroke-dasharray:3 9;animation:flow 1.4s linear infinite;stroke-linecap:round}
.net .flow.in{animation-direction:reverse}
@keyframes flow{to{stroke-dashoffset:-24}}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;width:100px;text-align:center}
.node .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);box-shadow:0 10px 24px -14px rgba(0,0,0,.35),inset 0 0 0 1px var(--line);position:relative;transition:transform .4s var(--ease)}
.node:hover .ic{transform:scale(1.08)}
.node .ic::after{content:"";position:absolute;right:0;top:0;width:12px;height:12px;border-radius:50%;border:2px solid var(--soft);background:var(--dim2)}
.node.ok .ic::after{background:var(--green)}.node.wait .ic::after{background:#d08a1f}.node.err .ic::after{background:var(--red)}
.node span{font-size:13px;font-weight:600;line-height:1.2}
.node small{font-size:11px;color:var(--dim);line-height:1.25}
.hub .ic{width:90px;height:90px;background:var(--ink);color:var(--bg);box-shadow:0 20px 40px -18px rgba(0,0,0,.5)}
.hub .ic::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid var(--line2);animation:halo 3s var(--ease) infinite}
@keyframes halo{from{transform:scale(.85);opacity:1}to{transform:scale(1.3);opacity:0}}
.hub .ic::after{display:none}
@media (max-width:600px){.node{width:76px}.node .ic{width:44px;height:44px}.node .ic svg{width:20px;height:20px}.hub .ic{width:70px;height:70px}.node small{display:none}}
.conn{padding:20px;display:grid;gap:14px;align-content:start}
.conn .hd{display:flex;align-items:center;gap:12px}
.conn .hd .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--soft);flex:none}
.conn .hd b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em}
.conn .hd small{display:block;color:var(--dim);font-size:13px}
.conn .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.conn .stats div{padding:10px 12px;border-radius:12px;background:var(--soft)}
.conn .stats b{display:block;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.conn .stats span{font-size:11.5px;color:var(--dim)}
.steps{display:grid;gap:9px;counter-reset:s;font-size:14px;color:var(--ink2);padding:0;margin:0}
.steps li{list-style:none;display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:500 10.5px var(--mono);background:var(--soft);color:var(--dim)}
.steps li.done::before{content:"✓";background:var(--green);color:#fff}
.secret{display:flex;gap:8px;align-items:center}
.secret .in{font-family:var(--mono);font-size:13px}
.icn{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font:700 12px var(--sans);color:#fff}

/* activité */
.feed{display:grid}
.ev{display:grid;grid-template-columns:30px 1fr auto;gap:12px;padding:12px 20px;border-top:1px solid var(--line);align-items:start;font-size:14px}
.ev:first-child{border-top:0}
.ev .ei{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--dim)}
.ev.warn .ei{color:var(--amber);background:#f7ecd8}.ev.error .ei{color:var(--red);background:#f8e4df}.ev.ok .ei{color:var(--green);background:#e3f1e9}
.ev time{font:500 10.5px var(--mono);letter-spacing:.04em;color:var(--dim);white-space:nowrap;padding-top:5px}

/* tiroir : comme le panier du site */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(18,18,18,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .35s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;transform:translateY(105%);visibility:hidden;transition:transform .55s var(--ease),visibility 0s .55s;padding:8px 20px calc(var(--sab) + 28px);box-shadow:0 -30px 80px -20px rgba(0,0,0,.3)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--soft2);margin:4px auto 14px}
.sheet .x{position:sticky;top:0;float:right;z-index:2}
.sheet .x:hover{transform:rotate(90deg)}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .sheet{transform:none;visibility:visible;transition:transform .55s var(--ease)}
@media (min-width:980px){.sheet{left:auto;top:8px;bottom:8px;right:8px;width:min(520px,calc(100vw - 16px));max-height:none;border-radius:20px;transform:translateX(calc(100% + 20px));padding:22px 26px 30px}.sheet .grab{display:none}}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px 16px;padding:0 20px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{height:240px;width:auto;max-width:86%;border-radius:14px;object-fit:cover;scroll-snap-align:start;background:var(--soft)}
.kv{display:grid;grid-template-columns:auto 1fr;font-size:14.5px;margin:14px 0}
.kv dt,.kv dd{margin:0;padding:10px 0;border-bottom:1px solid var(--line)}
.kv dt{color:var(--dim)}.kv dd{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.st{font-size:28px;font-weight:600;letter-spacing:-.035em;line-height:1.1;margin:10px 0 10px}
.block{display:grid;gap:10px;margin-top:20px}
.block>b{font-size:13.5px;color:var(--dim);font-weight:500}
.chan{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:14.5px}
.chan:first-of-type{border-top:0}
.track{display:flex;gap:4px;margin:12px 0 4px}.track i{flex:1;height:4px;border-radius:9px;background:var(--soft2)}.track i.on{background:var(--ink)}

/* palette */
.pal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;padding:calc(var(--sat) + 10vh) 14px 14px;background:rgba(18,18,18,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.pal.on{display:flex}
.pal .box{width:100%;max-width:640px;border-radius:20px;background:var(--bg);box-shadow:0 30px 80px rgba(0,0,0,.25);overflow:hidden;animation:pop .3s var(--ease)}
@keyframes pop{from{transform:translateY(-8px);opacity:0}}
.pal input{width:100%;height:60px;border:0;border-bottom:1px solid var(--line);background:none;padding:0 22px;font-size:17px;outline:0;color:var(--ink)}
.pal .res{max-height:min(60vh,460px);overflow:auto;padding:8px}
.pal .res button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border-radius:12px;text-align:left;font-size:14.5px}
.pal .res button.sel,.pal .res button:hover{background:var(--soft)}
.pal .res small{margin-left:auto;color:var(--dim);font-size:12.5px}
.pal .grp{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--acc);padding:12px 14px 4px}

/* divers */
.empty{padding:36px 20px;text-align:center;color:var(--dim);font-size:14.5px;background:var(--soft);border-radius:var(--r);line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + var(--sab) + 24px);z-index:90;transform:translate(-50%,16px);opacity:0;display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;transition:.4s var(--ease);pointer-events:none;max-width:calc(100% - 32px);box-shadow:0 20px 40px -15px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:1180px){.toast{bottom:28px}}
.banner{display:flex;gap:10px;align-items:center;padding:11px 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:13.5px;margin-bottom:26px}
.banner svg{color:#c9d4ff;flex:none}
.banner a{text-decoration:underline;text-underline-offset:3px}
.banner b{color:#c9d4ff}
@media (max-width:560px){.banner{border-radius:16px}}
.err{color:var(--red);font-size:14px}
.reveal{animation:rise .8s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.login{min-height:100dvh;display:grid;place-items:center;padding:calc(var(--sat) + 24px) 20px 24px}
.login .box{width:100%;max-width:440px}
.login form{display:grid;gap:12px;margin-top:30px}
.login .h1{font-size:clamp(54px,12vw,84px);margin-top:18px}
.orb{display:flex;align-items:center;gap:11px;font-weight:700;font-size:19px;letter-spacing:-.02em}
.tline{display:grid;border-left:1px solid var(--line2);margin-left:6px;padding-left:18px}
.tline .day{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin:18px 0 10px;position:relative}
.tline .day::before{content:"";position:absolute;left:-24px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px var(--bg)}
.sim{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sim div{padding:12px 14px;border-radius:12px;background:var(--soft)}
.sim b{display:block;font-size:22px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sim span{font-size:12px;color:var(--dim)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chipx{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 14px;border-radius:999px;background:var(--soft);font-size:14px;transition:background .3s}
.chipx:hover{background:var(--soft2)}
.chipx.off{opacity:.45;text-decoration:line-through}
.chipx button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}
.chipx button:hover{background:var(--ink);color:var(--bg)}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.menu a,.menu button{display:flex;align-items:center;gap:10px;padding:16px;border-radius:14px;background:var(--soft);font-size:14.5px;font-weight:500;text-align:left;transition:background .3s,color .3s}
.menu a:hover,.menu button:hover{background:var(--ink);color:var(--bg)}
.menu a:hover svg,.menu button:hover svg{color:#c9d4ff}
.menu svg{color:var(--acc);flex:none}
.menu b{margin-left:auto;font:600 10px var(--mono);background:var(--acc);color:#fff;border-radius:99px;padding:2px 7px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<div id="root"></div>
